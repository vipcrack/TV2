name: Build FFZYTV APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pillow
        run: pip install Pillow

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create project directory
        run: mkdir -p FFZYTV

      - name: Generate Gradle Wrapper (official way)
        working-directory: FFZYTV
        run: |
          gradle wrapper --gradle-version 8.3
          chmod +x gradlew

      - name: Generate Android project source
        run: python build_ffzytv.py

      # Optional: Restore keystore if needed (example using secret)
      - name: Restore keystore (optional)
        run: |
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > FFZYTV/app/ffzytv.keystore
          fi

      - name: Build Release APK
        working-directory: FFZYTV
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: FFZYTV/app/build/outputs/apk/release/app-release.apk
