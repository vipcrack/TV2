name: Build FFZYTV APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: pip install Pillow

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify keytool
        run: |
          which keytool
          keytool -help >/dev/null

      - name: Generate project
        run: python build_ffzytv.py

      - name: Debug: List generated files
        run: |
          echo "=== Root ==="
          ls -la FFZYTV/
          echo "=== gradle/wrapper ==="
          ls -la FFZYTV/gradle/wrapper/
          echo "=== app/ ==="
          ls -la FFZYTV/app/
