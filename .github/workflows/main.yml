name: Build FFZYTV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Generate Android project
        run: python build_ffzytv.py

      - name: Restore keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > FFZYTV/app/ffzytv.keystore

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable and download Gradle Wrapper
        working-directory: FFZYTV
        run: |
          chmod +x gradlew
          ./gradlew --version  # This triggers download of gradle-wrapper.jar

      - name: Build Release APK
        working-directory: FFZYTV
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find generated APK
        id: find_apk
        run: |
          apk_path=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$apk_path" ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          echo "apk_path=$apk_path" >> $GITHUB_OUTPUT
          echo "✅ APK found at: $apk_path"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffzytv-release-apk
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Create GitHub Release and upload APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          tag_name: v1.${{ github.run_number }}
          name: FFZYTV Release v1.${{ github.run_number }}
          body: |
            📺 Auto-built Android TV APK  
            🔗 API: https://cj.ffzyapi.com/  
            🎨 Includes custom icon ("FF") and TV banner ("FFZYTV")  
            ⏱️ Built on ${{ runner.os }} at ${{ github.event.head_commit.timestamp }}
