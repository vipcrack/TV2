name: Build FFZYTV APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android project
        run: python build_ffzytv.py

      - name: Build Release APK
        run: |
          cd FFZYTV
          chmod +x gradlew  # 确保可执行（某些系统需要）
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List APK files (debug)
        run: ls -l FFZYTV/app/build/outputs/apk/release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFZYTV-release-apk
          path: FFZYTV/app/build/outputs/apk/release/app-release.apk
