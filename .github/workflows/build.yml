name: Build FFZYTV Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (optional)
        run: |
          # 如果未来有 requirements.txt 可启用
          # pip install -r requirements.txt
          echo "No extra Python deps needed."

      - name: Generate Android project
        run: python build_ffzytv.py

      - name: Grant execute permission to gradlew
        run: chmod +x FFZYTV/gradlew

      - name: Build debug APK
        working-directory: ./FFZYTV
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffzytv-debug-apk
          path: ./FFZYTV/app/build/outputs/apk/debug/app-debug.apk
