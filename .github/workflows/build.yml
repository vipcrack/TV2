name: Build FFZYTV Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest  # 使用 Ubuntu 环境以避免 Windows 编码问题

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 验证 assets/gradle-wrapper.jar 是否存在
      - name: Verify assets/gradle-wrapper.jar
        run: |
          if [ ! -f "assets/gradle-wrapper.jar" ]; then
            echo "❌ ERROR: assets/gradle-wrapper.jar is missing!"
            echo "💡 Please commit the file generated by:"
            echo "   gradle wrapper --gradle-version 8.6"
            echo "   mkdir -p assets && cp gradle/wrapper/gradle-wrapper.jar assets/"
            exit 1
          fi
          echo "✅ Found assets/gradle-wrapper.jar ($(stat -c%s assets/gradle-wrapper.jar) bytes)"

      # 设置 Java 环境（JDK 17）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 设置 Python 环境（Python 3.10）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 设置 PYTHONIOENCODING 环境变量为 utf-8
      - name: Set UTF-8 for Python
        run: echo "PYTHONIOENCODING=utf-8" >> $GITHUB_ENV

      # 安装 Pillow（可选，用于生成图标）
      - name: Install Pillow (optional for icons)
        run: pip install Pillow

      # 运行 Python 脚本生成 Android 项目结构
      - name: Generate Android project
        env:
          PYTHONIOENCODING: utf-8  # 强制 Python 使用 UTF-8 输出
        run: python build_ffzytv.py

      # 给 gradlew 添加可执行权限
      - name: Make gradlew executable
        run: chmod +x FFZYTV/gradlew

      # 构建 APK
      - name: Build debug APK
        working-directory: ./FFZYTV
        run: ./gradlew assembleDebug --no-daemon

      # 上传生成的 APK 文件
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ffzytv-debug-apk
          path: ./FFZYTV/app/build/outputs/apk/debug/app-debug.apk
