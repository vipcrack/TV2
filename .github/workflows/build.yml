name: Build FFZYTV Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: python build_ffzytv.py

      - run: chmod +x FFZYTV/gradlew

      - run: ./gradlew assembleDebug --no-daemon
        working-directory: ./FFZYTV

      - uses: actions/upload-artifact@v4
        with:
          name: ffzytv-debug-apk
          path: ./FFZYTV/app/build/outputs/apk/debug/app-debug.apk
