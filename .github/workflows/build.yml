name: Build FFZYTV APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify gradle-wrapper.jar exists
        run: |
          if [ ! -f "assets/gradle-wrapper.jar" ]; then
            echo "[ERROR] assets/gradle-wrapper.jar is missing!"
            echo "Please generate and commit it locally:"
            echo "  gradle wrapper --gradle-version 8.6"
            echo "  mkdir -p assets && cp gradle/wrapper/gradle-wrapper.jar assets/"
            exit 1
          fi
          echo "[OK] Found assets/gradle-wrapper.jar ($(stat -c%s assets/gradle-wrapper.jar) bytes)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install Pillow

      - name: Generate Android project
        env:
          PYTHONIOENCODING: utf-8
        run: python build_ffzytv.py

      - name: Build debug APK
        working-directory: ./FFZYTV
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffzytv-debug-apk
          path: ./FFZYTV/app/build/outputs/apk/debug/app-debug.apk
