name: Build FFZYTV APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify keytool
        run: |
          which keytool
          keytool -help >/dev/null

      - name: Generate Android project
        run: python build_ffzytv.py

      - name: Ensure gradlew exists and is executable
        run: |
          if [ ! -f FFZYTV/gradlew ]; then
            echo "ERROR: gradlew not found!"
            ls -la FFZYTV/
            exit 1
          fi
          chmod +x FFZYTV/gradlew

      - name: Build Release APK
        run: |
          cd FFZYTV
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FFZYTV-release-apk
          path: FFZYTV/app/build/outputs/apk/release/app-release.apk
