jobs:
  build:
    runs-on: ubuntu-latest  # 确保是 Linux

    steps:
      - uses: actions/checkout@v4

      - name: Verify assets/gradle-wrapper.jar
        run: test -f assets/gradle-wrapper.jar || { echo "Missing JAR!"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Android project
        env:
          PYTHONIOENCODING: utf-8  # 关键！
        run: python build_ffzytv.py

      - name: Build debug APK
        working-directory: ./FFZYTV
        run: ./gradlew assembleDebug --no-daemon
